    sym: pick(['yahoosecuritycode', 'yahoocode', 'yahooticker', 'yahoosymbol', 'yahoo', 'tradingsymbol', 'symbol', 'ticker']),\n      isin: pick(['isin']),\n      /* A bare \"Type\" column is the asset class in most broker exports - but it\n         is also what some of them call the transaction type, which is already\n         claimed above. Take it only when it did not win that slot, otherwise\n         every row's class reads as \"Buy\". */\n      atype: pick(['assettype', 'securitytype', 'segment', 'instrumenttype', 'type']) === type\n        ? pick(['assettype', 'securitytype', 'segment', 'instrumenttype'])\n        : pick(['assettype', 'securitytype', 'segment', 'instrumenttype', 'type'])\n    };\n  }\n\n  /* Every distinct value in the type column is shown in the import dialog with\n     the kind it was read as, and the reader can correct any of them. An override\n     wins over the verb patterns below, so a broker that writes \"Contribution\"\n     or \"BUY-CNC\" is understood without editing 200 rows. */\n  txKind(type, amount, qty, ov) {\n    const t = (type || '').toLowerCase();\n    if (ov) {\n      const o = ov[t.trim()];\n      if (o && o !== 'auto') return o === 'skip' ? 'skip' : o;\n    }\n    if (/drip/.test(t)) return 'income';\n    if (/reinvest|savings|purchase|^buy|subscription/.test(t) && qty > 0) return 'buy';\n    if (/^sell|redemption|disposal/.test(t)) return 'sell';\n    /* Bonus and split are different calculations, so they are different kinds:\n       a bonus issues nil-cost shares, a split subdivides the ones held. */\n    if (/bonus/.test(t)) return qty > 0 ? 'bonus' : 'skip';\n    if (/split|consolidat/.test(t)) return qty > 0 ? 'split' : 'skip';\n    if (/transfer|corporate|merger/.test(t) && qty > 0) return amount > 0 ? 'sell' : 'buy';\n    if (/^buy/.test(t)) return 'buy';\n    /* A cash dividend often carries a quantity (the payout, priced at 1.00), so\n       quantity cannot decide this - only an explicit \"reinvest\" above does. here, so its value belongs in the terminal figure too. Manually\n     entered account balances do not - nothing in the flows paid for them.\n\n     Each flow converts at the row's own recorded rate on its own date, never\n     today's, so an old INR buy does not fabricate FX return. */\n  xirrFlows() {\n    const out = [];\n    (this.state.imports || []).forEach(j => {\n      const m = j.map, g = (r, k) => m[k] ? (r[m[k]] || '') : '';\n      const baseAmount = !!(m.amount && /eur/i.test(m.amount));\n      (j.rows || []).forEach(r => {\n        if (!this.inScope((g(r, 'account') || '').trim() || j.acct)) return;\n        const t = this.txTime(g(r, 'date'), '');\n        if (typeof t !== 'number') return;\n        const qty = Math.abs(this.numSep(g(r, 'qty'), j.dec)) || 0;\n        const amtRaw = this.numSep(g(r, 'amount'), j.dec);\n        const kind = this.txKind(g(r, 'type'), isFinite(amtRaw) ? amtRaw : 0, qty, j.actions);\n        if (kind !== 'buy' && kind !== 'sell' && kind !== 'income' && kind !== 'fee') return;\n        const ccy = (g(r, 'ccy') || '').toUpperCase().replace(/[^A-Z]/g, '') || j.fallbackCcy || 'EUR';\n        const fxr = this.numSep(g(r, 'fxrate'), j.dec);\n        const rate = isFinite(fxr) && fxr > 0 ? fxr : (this.rate(ccy) || 0);\n        const price = this.numSep(g(r, 'price'), j.dec) || 0;\n        const hasAmt = isFinite(amtRaw) && amtRaw;\n        const eur = hasAmt ? (baseAmount ? Math.abs(amtRaw) : Math.abs(amtRaw) * rate) : qty * price * rate;\n        const feeEur = (Math.abs(this.numSep(g(r, 'fee'), j.dec)) || 0) * rate;\n        const a = kind === 'buy' ? -(eur + feeEur)\n          : kind === 'sell' ? eur - feeEur\n          : kind === 'income' ? eur\n          : -(feeEur || eur);\n        if (!isFinite(a) || !a) return;\n        out.push({ t, a, d: new Date(t * 1000).toISOString().slice(0, 10) });\n      });\n    });\n    return out.sort((a, b) => a.t - b.t);\n  }\n\n  /* One €9 trade in 2020 must not set the denominator for a portf ];\n        dt.setUTCDate(dt.getUTCDate() - 1);\n      }\n      return null;\n    };\n    const terminalPrice = h.closes[h.last];\n    if (!(terminalPrice > 0)) return { val: null, why: 'benchmark history unavailable' };\n    let units = 0;\n    for (const f of flows) {\n      if (f.d < h.first) return { val: null, why: 'benchmark history starts ' + h.first };\n      const px = closeOn(f.d);\n      if (!px) return { val: null, why: 'no benchmark close for ' + f.d };\n      units -= f.a / px;\n    }\n    const terminal = units * terminalPrice;\n    if (!(terminal > 0)) return { val: null, why: 'benchmark flows net to nothing' };\n    const val = this.xirr(flows.concat([{ t: Math.floor(Date.now() / 1000), a: terminal }]));\n    return { val, why: val == null ? 'benchmark flows do not resolve' : '' };\n  }\n\n  fetchBench = async () => {\n    const sym = (this.state.benchSym || 'IWDA.AS').trim();\n    if (!sym) return;\n    const flows = this.materialFlows(this.xirrFlows()).flows;\n    const from = flows.length ? flows[0].d : '2015-01-01';\n    const hit = this.histCache(sym, from);\n    if (hit) {\n      const ds = Object.keys(hit.closes || {}).sort();\n      this.setState({\n        benchLoading: false,\n        benchHist: { symbol: sym, currency: hit.currency, first: ds[0], last: ds[ds.length - 1], closes: hit.closes, cached: this.ageLabel(this._lastCacheAge || 0) }\n      });\n      return;\n    }\n    this.setState({ benchLoading: true });\n    /* Try the batched endpoint first: it is the same data, is edge-cached, and\n       does not compete with the per-symbol limit that the value-history load\n       exhausts. */\n    try {\n      const yrs = (Date.now() - Date.parse(from + 'T00:00:00Z')) / (365.25 * 864e5);\n      const rng = yrs > 10 ? 'max' : yrs > 5 ? '10y' : yrs > 2 ? '5y' : yrs > 1 ? '2y' : '1y';\n      const r = await fetch('/.netlify/functions/sparks?symbols=' + encodeURIComponent(sym) + '&range=' + rng, { cache: 'no-store' });\n      const j = r.ok ? await r.json() : {};\n      const got = j.series && j.series[sym];\n      if (got && got.closes && Object.keys(got.closes).length) {\n        const ds = Object.keys(got.closes).sort();\n        this.histCacheSet(sym, from, { closes: got.closes, currency: got.currency, via: got.via });\n        this.setState({ benchLoading: false, benchHist: { symbol: sym, currency: got.currency, first: ds[0], last: ds[ds.length - 1], closes: got.closes, via: got.via } });\n        return;\n      }\n      if (j.reasons && j.reasons[sym]) {\n        this.setState({ benchLoading: false, benchHist: { symbol: sym, error: j.reasons[sym] } });\n        return;\n      }\n    } catch (e) { /* fall through to the per-symbol endpoint */ }\n    /* One request, but Yahoo's rate limit is per caller and the value-history\n       load can leave it hot for a while. A 429 is a \"wait\", so this waits -\n       three attempts over about twelve seconds - instead of reporting a\n       working symbol as unavailable. */\n    const waits = [0, 3000, 9000];\n    let last = 'unknown error';\n    for (const w of waits) {\n      if (w) await new Promise(r => setTimeout(r, w));\n      try {\n        const res = await fetch('/.netlify/functions/history?symbol=' + encodeURIComponent(sym)\n          + '&from=' + encodeURIComponent(from), { cache: 'no-store' });\n        if (!res.ok) throw new Error('HTTP ' + res.status);\n        const j = await res.json();\n        if (j.error) throw new Error(j.error);\n        this.histCacheSet(sym, from, { closes: j.closes, currency: j.currency });\n        this.setState({ benchLoading: false, benchHist: { symbol: sym, currency: j.currency, first: j.first, last: j.last, closes: j.closes } });\n        return;\n      } catch (e) {\n        last = String((e && e.message) || e);\n        if (!/429|timed out/.test(last)) break;\n        this.setState({ benchHist: { symbol: sym, error: last + ' - rate limited, retrying…' } });\n      }\n    }\n    this.setState({\n      benchLoading: false,\n      benchHist: { symbol: sym, error: /429/.test(last) ? 'Too many requests. Wait a minute and try again.' : last }\n    });\n  };\n\n  /* Bisection, not Newton: a portfolio with many sign changes can send Newton\n     off to a nonsense root, and 200 halvings over a bounded range converge to\n     more precision than a percentage needs. */\n  xirr(flows) {\n    if (flows.length < 2) return null;\n    if (!flows.some(f => f.a < 0) || !flows.some(f => f.a > 0)) return null;\n    const t0 = flows[0].t, YR = 365.2425 * 86400;\n    const npv = r => flows.reduce((a, f) => a + f.a / Math.pow(1 + r, (f.t - t0) / YR), 0);\n    let lo = -0.9999, hi = 10;\n    let flo = npv(lo), fhi = npv(hi);\n    if (!isFinite(flo) || !isFinite(fhi) || flo * fhi > 0) return null;\n    for (let i = 0; i < 200; i++) {\n      const mid = (lo + hi) / 2, fm = npv(mid);\n      if (!isFinite(fm)) return null;\n      if (flo * fm <= 0) { hi = mid; fhi = fm; } else { lo = mid; flo = fm; }\n    }\n    const r = (lo + hi) / 2;\n    return isFinite(r) ? r * 100 : null;\n  }\n\n  /* txTime output back to a readable day for the STALE price label. */\n  dayLabel(v) {\n    if (typeof v !== 'number') return String(v || '').trim().slice(0, 10);\n    return new Date(v * 1000).toISOString().slice(0, 10);\n  }\n\n  /* Every identifier a transaction row carries, account-scoped and cleaned of\n     the placeholders brokers write into empty code columns. Used to decide\n     which rows describe the same instrument. */\n  txTokens(acct, vals) {\n    const bad = new Set(['NA', 'N/A', 'NONE', '-', '--', 'UNKNOWN', 'NULL']);\n    const out = [];\n    vals.forEach(v => {\n      const s = String(v == null ? '' : v).trim().toUpperCase();\n      if (!s || bad.has(s)) return;\n      const k = acct + '\\u0000' + s;\n      if (!out.includes(k)) out.push(k);\n    });\n    return out;\n  }\n\n  runFifo(rows, m, opts) {\n    const g = (r, k) => m[k] ? (r[m[k]] || '') : '';\n    const N = v => this.numSep(v, opts.dec .eur(sum.fees || 0),\n          _bk: bk, _bkPct: cb ? bk / cb : 0, _open: openPl, _income: sum.income || 0, _fees: sum.fees || 0\n        };\n      }), {\n        name: b => b.name, booked: b => b._bk, bookedPct: b => b._bkPct,\n        open: b => b._open, income: b => b._income, fees: b => b._fees\n      }),\n\n      csvExclude: c ? (c.exclude === undefined ? 'NA' : c.exclude) : '',\n      setCsvExclude: e => { const v = e.target.value; this.setState(s => ({ csv: Object.assign({}, s.csv, { exclude: v }) })); },\n      csvExcludeHint: (() => {\n        const n = txPre ? txPre.skippedByName : 0;\n        return (n ? n + ' rows dropped. ' : '') + 'Comma-separated names or tickers to skip.';\n      })(),\n\n      csvCcy: c ? (c.ccy || 'EUR') : 'EUR',\n      setCsvCcy: e => { const v = e.target.value; this.setState(s => ({ csv: Object.assign({}, s.csv, { ccy: v }) })); },\n      csvCcyHint: c && c.txMap && c.txMap.ccy\n        ? 'Used when a row has no currency.'\n        : 'No currency column - prices are read as ' + (c ? c.ccy : 'EUR') + '.',\n\n      csvAcct: c ? (c.acct || '') : '',\n      setCsvAcct: e => { const v = e.target.value; this.setState(s => ({ csv: Object.assign({}, s.csv, { acct: v }) })); },\n      csvAcctHint: c\n        ? (acctBuckets.some(a => a.label === (c.acct || '').trim())\n          ? 'This account exists - it will be replaced.'\n          : (c.txMap && c.txMap.account ? 'Each row keeps its own broker. Rows without one are skipped.' : 'This file has no broker column, so everything goes here.'))\n        : '',\n      csvAcctColor: c && acctBuckets.some(a => a.label === (c.acct || '').trim()) ? 'var(--pt-stale)' : 'var(--color-neutral-600)',\n\n      cancelEdit: () => this.setState({ draft: null }), saveEdit: this.saveEdit,\n\n      detail: (() => {\n        const key = S.detailKey;\n        if (!key) return { open: false, rows: [], fields: [] };\n        /* An exited position is read from the closed list: nothing is held,\n           so its sheet trades value and forward figures for what the exit\n           booked. */\n        const exited = S.detailKind === 'closed';\n        const r = exited ? (S.closed || []).find(x => x.id === key)\n          : rows.find(x => x.id === key) || (S.holdings || []).find(x => x.id === key);\n        if (!r) return { open: false, rows: [], fields: [] };\n        const sym = this.priceSym(r);\n        const p = (S.profiles || {})[sym] || null;\n        const busy = !!(S.profileBusy || {})[sym];\n        const val = r.value || 0;\n        const terPct = p && p.ter != null ? p.ter : null;\n        const yldPct = p && p.yield != null ? p.yield : null;\n        const led = this.ledgerCharges(r);\n        const feesPaid = led.fees;\n        const rate = 1;\n        const drag = terPct != null ? val * terPct / 100 : null;\n        const incomeSoFar = led.income;\n        /* Account-level charges are real money this position bore a share of,\n           so they are attributed by its weight within its own account and\n           labelled as an attribution rather than a booked figure. */\n        const acctVal = rows.filter(x => x.account === r.account && !x.cashLike).reduce((s, x) => s + (x.value || 0), 0);\n        const acctShare = led.acctFees > 0 && acctVal > 0 ? led.acctFees * (val / acctVal) : (led.acctFees > 0 ? null : null);\n        const fwdIncome = yldPct != null ? val * yldPct / 100 : null;\n        /* Every figure carries its own plain-language explanation behind a\n           \"?\", because half of them are projections and the difference\n           between a projection and a fact has to be one tap away. */\n        const help = {\n          ISSUER: 'The company that runs the fund.',\n          STRUCTURE: 'The fund\\u2019s legal type, e.g. UCITS ETF.',\n          CATEGORY: 'What the fund invests in.',\n          LISTING: 'The exchange this line trades on.',\n          SECTOR: 'The part of the economy this company works in.',\n          INDUSTRY: 'Its line of business within that sector.',\n          TER: 'The fund\\u2019s yearly fee, taken from its price.',\n          'Annual drag': 'That yearly fee in euros, on today\\u2019s value.',\n          'Fees paid': 'Broker fees on this holding.',\n          'Account charges': 'This holding\\u2019s share of fees charged to the whole account.',\n          'Total so far': 'Fees paid plus a year of fund fees.',\n          YIELD: 'Paid out over the last 12 months, as a share of the price.',\n          'Expected / year': 'What you\\u2019d receive in a year at that rate.',\n          RECEIVED: 'Dividends paid to you, after tax.',\n          'Next payment': 'The next announced pay date.',\n          VALUE: 'Worth at the latest price.',\n          COST: 'What you paid for what you hold.',\n          'Open P/L': 'Your gain or loss if you sold today.',\n          '% portfolio': 'Share of your whole portfolio.',\n          'Reinvests?': 'Accumulating funds reinvest dividends. Distributing funds pay them out.',\n          'Booked P/L': 'Profit or loss from selling.',\n          'Bought for': 'What the shares you sold cost you.',\n          'Sold for': 'What you got for them.',\n          RETURN: 'Booked P/L as a share of cost.',\n          'Last trade': 'The date of your final sale.'\n        };\n        const field = (label, value, note) => ({\n          label, value: value == null || value === '' ? '—' : value, note: note || '',\n          help: help[label] || '',\n          open: S.detailHelp === label,\n          on: () => this.setState({ detailHelp: label }),\n          off: () => this.setState(s => (s.detailHelp === label ? { detailHelp: '' } : {})),\n          tap: () => this.setState(s => ({ detailHelp: s.detailHelp === label ? '' : label }))\n        });\n        /* A share is not a fund: it has no expense ratio, no issuer and no\n           legal wrapper, so those fields are replaced rather than shown\n           empty - a blank TER on a stock reads as missing data. */\n        const qt = String((p && p.quoteType) || '').toUpperCase();\n        /* Yahoo's type is the best evidence, but it is often absent - so the\n           instrument's own name decides next. \"UCITS ETF\", \"ETC\" and \"Fund\"\n           are in the name of nearly every European fund, and reading a fund\n           as a company was hiding the TER row it should have shown. */\n        const nm = String(r.name || '') + ' ' + String(r.ticker || '');\n        const nameFund = /\\b(etf|etc|ucits|fund|sicav|index|trust|acc|dist)\\b/i.test(nm);\n        const isFund = qt === 'ETF' || qt === 'MUTUALFUND' || nameFund || /etf|fund/i.test(String(r.cls || ''));\n        const isStock = !isFund && (qt === 'EQUITY' || /equity|stock|share/i.test(String(r.cls || '')));\n        const identity = { label: isStock ? 'Company' : 'Fund', fields: (isStock ? [\n          field('Sector', p && p.sector), field('Industry', p && (p.industry || p.category)),\n          field('Listing', p && p.exchange)\n        ] : [\n          field('Issuer', p && p.family), field('Structure', p && p.legalType),\n          field('Category', p && p.category), field('Listing', p && p.exchange)\n        ]) };\n        const received = field('Received', incomeSoFar != null ? this.eur(incomeSoFar * rate) : null,\n          incomeSoFar == null ? 'not in your transactions'\n            : led.incSeen ? 'after tax'\n            : 'none recorded');\n        const reinvests = isFund ? [field('Reinvests?', led.incSeen ? 'Pays out' : 'Accumulates',\n          led.incSeen ? 'dividends recorded' : 'no dividends recorded')] : [];\n        /* Fees and P/L are the Booked P/L row's own figures, converted the\n           same way, so the sheet never disagrees with the row it opened from. */\n        const fx = this.rate(r.ccy) || 0;\n        const exitedGroups = exited ? [\n          identity,\n          { label: isStock ? 'Cost of holding' : 'Cost of ownership', fields: (isStock ? [] : [\n            field('TER', terPct != null ? this.pct(ter     opacity: secOn && !on ? 0.3 : 1,\n            rowBg: on ? 'rgba(145,132,217,.14)' : 'transparent',\n            enter: () => this.setState({ detailSector: s.key }),\n            leave: () => this.setState(st => (st.detailSector === s.key ? { detailSector: '' } : {})),\n            tap: () => this.setState({ detailSector: s.key })\n          };\n        }).filter(s => s.d);\n        const secShown = secOn || secList[0];\n        const secVia = ((p && p.via) || []).filter(v => (v.fields || []).includes('sectors')).map(v => v.symbol)[0] || '';\n        return {\n          open: true,\n          title: r.name || r.ticker, sym,\n          sub: [r.ticker, r.account, r.ccy, exited ? 'exited' : ''].filter(Boolean).join('  ·  '),\n          hasSectors: sectors.length > 0, sectors,\n          sectorCenterLabel: secShown ? secShown.label : '',\n          sectorCenterValue: secShown ? this.pct(secShown.pct) : '',\n          sectorNote: 'How the fund\\u2019s shares are spread across sectors.',\n          busy, busyText: busy ? 'Loading details…' : '',\n          /* A sheet full of dashes needs to say WHY - an unresolvable code, a\n             listing Yahoo does not profile, or a call that has not run. */\n          err: p && (p.error || p.limited) ? 'Couldn\\u2019t load fund details right now.'\n            : p && p.empty ? 'Some details aren\\u2019t available for this one. Your own figures below are complete.'\n            : !p && !busy ? 'Details not loaded yet.' : '',\n          hasErr: !!(p && (p.error || p.limited || p.empty)) || !!(!p && !busy),\n          resolvedNote: '',\n          /* Structure first, then what it costs, then what it pays - the\n             order a holding is actually questioned in. */\n          groups: exitedGroups || [\n            identity,\n            { label: isStock ? 'Cost of holding' : 'Cost of ownership', fields: (isStock ? [] : [\n              field('TER', terPct != null ? this.pct(terPct) : null, 'per year'),\n              field('Annual drag', drag != null ? this.eur(drag * rate) : null, 'TER on today\\u2019s value')\n            ]).concat([\n              field('Fees paid', feesPaid != null ? this.eur(feesPaid * rate) : null,\n                feesPaid == null ? 'not in your transactions'\n                  : led.feeSeen ? 'charges booked against this holding'\n                  : 'no charges booked against this holding'),\n              field('Account charges', acctShare != null ? this.eur(acctShare) : null,\n                acctShare != null ? 'share of ' + r.account + '\\u2019s charges, by value' : 'none booked at account level'),\n              field('Total so far',\n                feesPaid == null ? null : this.eur((feesPaid + (acctShare || 0) + (drag || 0)) * rate),\n                isStock ? 'fees plus account charges' : 'fees plus a year of TER')\n            ]) },\n            { label: 'Income', fields: reinvests.concat([\n              field('Yield', yldPct != null ? this.pct(yldPct) : null, 'trailing twelve months'),\n              field('Expected / year', fwdIncome != null ? this.eur(fwdIncome * rate) : null, 'yield on today\\u2019s value'),\n              received,\n              field('Next payment', p && p.divDate, 'next announced pay date')\n            ]) },\n            { label: 'Position', fields: [\n              field('Value', this.eur(val)), field('Cost', this.eur(r.cost || 0)),\n              field('Open P/L', this.eurSigned(r.pl || 0)), field('% portfolio', this.pct(r.weight || 0))\n            ] }\n          ],\n          note: exited\n            ? 'Fund details describe the fund today. Profit, cost and fees match the Booked P/L row.'\n            : 'Fees and dividends come from your own records. Account charges are shared out by value. Yearly figures are estimates at today\\u2019s value.',\n          close: () => this.setState({ detailKey: null }),\n          refetch: () => this.fetchProfile(sym)\n        };\n      })(),\n      bdCloseDetail: this.bd(() => this.setState({ detailKey: null })),\n\n      /* Holdings edits take effect as they are made - a class, a region, a\n         quantity is written straight to the position. The only held state is\n         a row marked for deletion, so that is the only thing worth a banner\n         here; saying \"apply\" for the rest would imply the edits had not\n         landed yet. */\n      holdPending: Object.keys(S.holdDel || {}).length > 0,\n      holdPendingText: (() => {\n        const n = Object.keys(S.holdDel || {}).length;\n        return (n === 1 ? 'One position is' : n + ' positions are') + ' marked for deletion. Press Confirm to remove, or Keep.';\n      })(),\n      holdPendingBg: S.theme === 'light' ? '#fdeaec' : 'rgba(223,100,112,.12)',\n      holdDelAll: () => this.setState(s => {\n        const m = s.holdDel || {};\n        return { holdings: s.holdings.filter(h => !m[h.id]), holdDel: {} };\n      }),\n      holdDelAllLabel: (() => {\n        const n = Object.keys(S.holdDel || {}).length;\n        return n === 1 ? 'Delete it' : 'Delete all ' + n;\n      })(),\n      /* Only one holding can be marked at a time, so the count is always one -\n         but the label matches the Transactions button word for word, because\n         the same escape should read the same on both tabs. */\n      holdKeepLabel: (() => {\n        const n = Object.keys(S.holdDel || {}).length;\n        return n === 1 ? 'Keep 1 row' : 'Keep all ' + n + ' rows';\n      })(),\n      holdCancelDel: () => this.setState({ holdDel: {} }),\n\n      isData: S.showData,\n      openData: () => this.setState({ showData: true }),\n      closeData: () => this.setState({ showData: false }),\n      dataMeta: rows.length + ' holdings · ' + acctBuckets.length + ' accounts · manual FX',\n      dataNote: S.dataNote, dataNoteColor: S.dataNoteColor || 'var(--color-neutral-600)',\n      copyJson: this.copyJson, shareJson: this.shareJson,\n      canShare: typeof navigator !== 'undefined' && !!navigator.share,\n      pasteTex
