  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

wap;\n  src: url(\"0c85d1ec-5421-445c-ad90-8bb7c61d6365\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Inter';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"92a11b4b-b08c-43bc-9053-81b4fbec606c\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n\n\n:root {\n  --color-bg: #161826;\n  --color-surface: #232532;\n  --color-text: #e9e9ed;\n  --color-accent: #9184d9; /* review round 7 (Barron): the accent moves to\n     the product's blurple — OKLCH hue 289.2, the hue of the app's own Pro\n     accent (#9a8fe0, --om-accent-pro) — at the same lightness the steel\n     accent held (L 0.660, so the documented ratios survive) and chroma\n     in the product blurple's own range (its token sits at C 0.118; the\n     accent takes 0.125, from the old steel's 0.030):\n     the accent now reads as an accent rather than another neutral. */\n  --color-accent-2: #a7a1db; /* the machine-derived stand-in follows: same\n     hue, same L 0.734, chroma at the same 2:3 proportion it held */\n  --color-divider: color-mix(in srgb, #e9e9ed 16%, transparent);\n\n  /* Tonal ramps — generated in OKLCH on one shared lightness scale, so the\n     same step of any role matches the others in visual value. */\n  --color-neutral-100: #f3f5fe;\n  --color-neutral-200: #e4e7f5;\n  --color-neutral-300: #cfd3e5;\n  --color-neutral-400: #b2b6ca;\n  --color-neutral-500: #9397ab;\n  --color-neutral-600: #75798c;\n  --color-neutral-700: #595d6c;\n  --color-neutral-800: #3f424d;\n  --color-neutral-900: #292b31;\n\n  --color-accent-100: #f5f4ff;\n  --color-accent-200: #e7e5fe;\n  --color-accent-300: #d2cefd;\n  --color-accent-400: #b5abfc;\n  --color-accent-500: #968ae0;\n  --color-accent-600: #796cbf;\n  --color-accent-700: #5d5294;\n  --color-accent-800: #423a6a;\n  --color-accent-900: #2b2741;\n\n  --color-accent-2-100: #f5f4ff;\n  --color-accent-2-200: #e7e5fe;\n  --color-accent-2-300: #d2cefd;\n  --color-accent-2-400: #b5afe8;\n  --color-accent-2-500: #9690c9;\n  --color-accent-2-600: #7972a9;\n  --color-accent-2-700: #5c5783;\n  --color-accent-2-800: #423e5d;\n  --color-accent-2-900: #2b293a;\n\n  /* Deck section-divider ground — review round 3: saturation as presence.\n     Dividers take a saturated deep indigo (hue 277, the neutral ramp's own\n     family; C 0.094 — written when the accent held C 0.030, before the\n     round-7 blurple raised it past the ground's) with a lighter bloom and\n     a ghost tint of the same hue, while the slide grounds stay\n     desaturated. Deck-scale fills only — not interface colors. */\n  --color-section: #262a60;\n  --color-section-glow: #353b80;\n  --color-section-ghost: #4c5397;\n\n  --font-heading: \"Inter\", system-ui, sans-serif;\n  --font-heading-weight: 500;\n  --font-body: \"Inter\", system-ui, sans-serif;\n\n  --space-1: 2.8px;\n  --space-2: 5.6px;\n  --space-3: 8.4px;\n  --space-4: 11.2px;\n  --space-6: 16.8px;\n  --space-8: 22.4px;\n\n  --radius-sm: 4px;\n  --radius-md: 8px;\n  --radius-lg: 14px;\n\n  /* Elevation — derived from the ground: soft ink-tinted shadows on a\n     light theme, a hairline edge + ambient darkness on a dark one. */\n  --shadow-sm: 0 0 0 1px #3f424d;\n  --shadow-md: 0 0 0 1px #595d6c, 0 6px 18px rgba(0,0,0,0.55);\n  --shadow-lg: 0 0 0 1px #9397ab, 0 16px 40px rgba(0,0,0,0.65);\n}\n\nbody {\n  background: var(--color-bg);\n  color: var(--color-text);\n  font-family: var(--font-body);\n}\nh1, h2, h3, h4 { font-family: var(--font-heading); font-weight: var(--font-heading-weight); }\n\n.lighten{mix-blend-mode:lighten;background-color:transparent}\n\n/* ══════════════════════════════════════════════════════════════════════════\n   Components — built with the tokens above. Plain CSS\n   on plain HTML: no JavaScript, no build step. Each class is documented in\n   readme.md and demonstrated in foundations/ and components/.\n   ══════════════════════════════════════════════════════════════════════ */\n\n*, *::before, *::after { box-sizing: border-box; }\nbody { margin: 0; font-size: 15px; line-height: 1.55; font-weight: 400; }\nh1, h2, h3, h4, h5, h6 {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  line-height: 1.12; letter-spacing: -0.015em; margin: 0 0 var(--space-2);\n}\nh1 { font-size: 42px; }\nh2 { font-size: 32px; }\nh3 { font-size: 25px; }\nh4 { font-size: 20px; }\nh5 { font-size: 16px; }\nh6 { font-size: 13px; }\nh6 { letter-spacing: 0.08em; text-transform: uppercase; }\np { margin: 0 0 var(--space-3); }\na { color: var(--color-accent); text-underline-offset: 3px; }\nimg { display: block; max-width: 100%; }\nfigure { margin: 0; }\nfigcaption {\n  font-size: 11px; margin-top: var(--space-1);\n  color: color-mix(in srgb, var(--color-text) 55%, transparent);\n}\n.text-muted { color: color-mix(in srgb, var(--color-text) 55%, transparent); }\n:focus { outline: none; }\n:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n::selection { background: color-mix(in srgb, var(--color-accent) 30%, transparent); }\n\n/* — rules — */\n/* Rules fade to transparent at both ends instead of stopping cleanly — a\n   Nocturne signature. The ramp is 48px an end (one deck baseline unit),\n   painted from the same divider token. Freestanding rules fade; box\n   outlines, in-control separators, and short accent marks stay solid. */\n.hr {\n  height: 1px; border: 0; margin: var(--space-4) 0;\n  background: linear-gradient(to right,\n    transparent, var(--color-divider) 48px,\n    var(--color-divider) calc(100% - 48px), transparent);\n}\n\n/* — buttons — */\n.btn {\n  display: inline-flex; align-items: center; justify-content: center; gap: 6px;\n  cursor: pointer; text-decoration: none;\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 14px; line-height: 1.2; color: var(--color-text); /* matches the .input's 14px —\n     the pair sits side by side in sign-up rows */\n  background: transparent; border: 1px solid transparent;\n  padding: var(--space-2) calc(var(--space-3) * 1.2);\n  border-radius: var(--radius-md);\n}\n.btn svg { display: block; }\n.btn:disabled { opacity: 0.45; cursor: not-allowed; }\n.btn-primary { color: var(--color-accent); border-color: var(--color-accent); }\n.btn-primary:hover { background: color-mix(in srgb, var(--color-accent) 12%, transparent); }\n.btn-primary:active { background: color-mix(in srgb, var(--color-accent) 22%, transparent); }\n.btn-secondary { border-color: var(--color-divider); }\n.btn-secondary:hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.btn-secondary:active { background: color-mix(in srgb, var(--color-text) 14%, transparent); }\n.btn-ghost { color: var(--color-accent); padding-inline: var(--space-1); }\n.btn-ghost:hover { background: color-mix(in srgb, var(--color-accent) 10%, transparent); }\n.btn-ghost:active { background: color-mix(in srgb, var(--color-accent) 18%, transparent); }\n.btn-icon { width: 36px; height: 36px; padding: 0; }\n.btn-block { width: 100%; margin-top: var(--space-2); }\n\n/* — forms — */\n.field > label {\n  display: block; font-size: 12px; margin-bottom: 5px;\n  color: color-mix(in srgb, var(--color-text) 70%, transparent);\n}\n.input {\n  width: 100%; min-height: 36px; padding: 6px 10px; font: inherit;\n  font-size: 14px; color: var(--color-text); caret-color: var(--color-accent);\n  background: var(--color-surface);\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.input:hover { border-color: color-mix(in srgb, var(--color-text) 45%, transparent); }\n.input:focus-visible { border-color: var(--color-accent); outline-offset: 0; }\ntextarea.input { min-height: 90px; resize: vertical; }\n.radio { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; }\n.radio input, .seg-opt input {\n  position: absolute; opacity: 0; width: 0; height: 0; pointer-events: none;\n}\n.radio .dot {\n  width: 16px; height: 16px; flex: none; border-radius: 50%;\n  border: 1.5px solid var(--color-divider);\n}\n.radio:hover .dot { border-color: var(--color-accent); }\n.radio input:checked + .dot {\n  border-color: var(--color-accent); background: var(--color-accent);\n  box-shadow: inset 0 0 0 4px var(--color-bg);\n}\n.radio input:focus-visible + .dot { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n.seg {\n  display: inline-flex; overflow: hidden;\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.seg-opt {\n  display: inline-flex; align-items: center; gap: 6px;\n  padding: 7px 12px; font-size: 13px; cursor: pointer;\n}\n.seg-opt + .seg-opt { border-left: 1px solid var(--color-divider); }\n.seg-opt:has(input:checked) { color: var(--color-accent); box-shadow: inset 0 0 0 1px var(--color-accent); }\n.seg-opt:not(:has(input:checked)):hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.seg-opt:has(input:focus-visible) { outline: 2px solid var(--color-accent); outline-offset: -2px; }\n\n/* — cards — */\n.card {\n  display: flex; flex-direction: column; gap: var(--space-2);\n  padding: var(--space-3); border-radius: var(--radius-md); background: var(--color-surface);\n}\n.card-kicker { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-accent); }\n.card-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 17px; line-height: 1.2;\n}\n.card-body { margin: 0; font-size: 13px; opacity: 0.8; flex: 1; }\n.card-meta {\n  display: flex; align-items: center; gap: 6px; font-size: 11px;\n  color: color-mix(in srgb, var(--color-text) 50%, transparent);\n}\n.elev-sm { box-shadow: var(--shadow-sm); }\n.elev-md { box-shadow: var(--shadow-md); }\n.elev-lg { box-shadow: var(--shadow-lg); }\n\n/* — tags — */\n.tag {\n  display: inline-flex; align-items: center; font-size: 11px;\n  letter-spacing: 0.02em; padding: 3px 10px;\n  border-radius: calc(var(--radius-md) * 0.75);\n}\n.tag-accent { background: var(--color-accent-800); color: var(--color-accent-100); }\n.tag-accent-2 { background: var(--color-accent-2-800); color: var(--color-accent-2-100); }\n.tag-neutral { background: var(--color-neutral-800); color: var(--color-neutral-100); }\n.tag-outline { border: 1px solid var(--color-accent); color: var(--color-accent); }\n\n/* — navigation — */\n.nav {\n  display: flex; align-items: center; gap: var(--space-4);\n  padding: var(--space-3) var(--space-4);\n  border-bottom: none;\n}\n.nav-brand {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 18px; margin-right: auto;\n}\n.nav a { color: inherit; text-decoration: none; font-size: 14px; }\n.nav a:hover, .nav a[aria-current='page'] { color: var(--color-accent); }\n\n/* — tables — */\n.table { width: 100%; border-collapse: collapse; font-size: 14px; }\n.table th {\n  text-align: left; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;\n  color: color-mix(in srgb, var(--color-text) 60%, transparent);\n  padding: var(--space-2); border-bottom: 1px solid transparent; /* keeps layout; the row paints the fading rule */\n}\n.table td {\n  padding: var(--space-2);\n  border-bottom: 1px solid transparent;\n}\n/* Row rules as row-level strips so the end-fade spans the row, not each cell. */\n.table thead tr {\n  background: linear-gradient(to right,\n    transparent, var(--color-divider) 48px,\n    var(--color-divider) calc(100% - 48px), transparent) no-repeat bottom / 100% 1px;\n}\n.table tbody tr {\n  background: linear-gradient(to right,\n    transparent, color-mix(in srgb, var(--color-text) 8%, transparent) 48px,\n    color-mix(in srgb, var(--color-text) 8%, transparent) calc(100% - 48px), transparent) no-repeat bottom / 100% 1px;\n}\n.table tbody tr:hover {\n  /* the hover tint layers over the row rule, which keeps painting */\n  background:\n    linear-gradient(color-mix(in srgb, var(--color-text) 4%, transparent),\n                    color-mix(in srgb, var(--color-text) 4%, transparent)) no-repeat 0 0 / 100% 100%,\n    linear-gradient(to right,\n      transparent, color-mix(in srgb, var(--color-text) 8%, transparent) 48px,\n      color-mix(in srgb, var(--color-text) 8%, transparent) calc(100% - 48px), transparent) no-repeat bottom / 100% 1px;\n}\n\n/* — dialog — */\n.dialog-backdrop {\n  position: fixed; inset: 0; display: grid; place-items: center;\n  padding: var(--space-4);\n  background: color-mix(in srgb, var(--color-neutral-900) 50%, transparent);\n}\n.dialog {\n  width: min(440px, 100%); display: flex; flex-direction: column; gap: var(--space-3);\n  padding: var(--space-4); border-radius: var(--radius-lg);\n  background: var(--color-surface); box-shadow: var(--shadow-lg);\n}\n.dialog-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 20px;\n}\n.dialog-body { font-size: 14px; opacity: 0.85; }\n.dialog-actions { display: flex; justify-content: flex-end; gap: var(--space-2); margin-top: var(--space-2); }\n\n<\u002Fstyle>\n<script src=\"b0fe75b7-a277-4695-a2f7-80f02b99f831\"><\u002Fscript>\n<script src=\"4a5d3a3e-6c79-4a15-b017-0bb3c3fc7830\"><\u002Fscript>\n<style>\nhtml{-webkit-text-size-adjust:100%;text-size-adjust:100%}\nbody{margin:0;background:var(--color-bg);color:var(--color-text);font-family:\"Inter\",system-ui,sans-serif;font-variant-numeric:tabular-nums;-webkit-text-size-adjust:100%;text-size-adjust:100%}\ndiv,span,td,th,button,select,input,textarea,p{-webkit-text-size-adjust:100%;text-size-adjust:100%}\na{color:var(--color-accent-600);text-decoration:none}a:hover{color:var(--color-accent-700)}\ntable{border-collapse:collapse}\ninput,select,button{font-family:inherit;font-variant-numeric:tabular-nums}\n::selection{background:var(--color-accent-800);color:var(--color-text)}\n*:focus-visible{outline:2px solid var(--color-accent);outline-offset:2px}\n:root{color-scheme:dark;--pt-dialog-bg:#1b1d2c;--pt-input-bg:#20222f;--pt-row-div:rgba(233,233,237,.06);--pt-backdrop:rgba(10,11,18,.72);--pt-card-bg:#1a1c2a;--pt-search-bg:#14161f;--pt-error-bg:#3a1f26;--pt-error-border:#5f2f38;--pt-error-text:#f0d3d7;--pt-notice-bg:#332a13;--pt-notice-border:#5c4a1e;--pt-notice-text:#e3c777;--pt-notice-text-soft:#f0e6cd;--pt-stale:#c9a24a;--pt-good:#57bf94;--pt-good-soft:#8fd3b4;--pt-bad-soft:#e2949c;--pt-bad-edge:#c56a76;--pt-edge:#3a3d4d;--pt-muted-fill:#33364a;--pt-on-accent:#161826;--pt-hover:rgba(233,233,237,.08);--pt-well:rgba(0,0,0,.16)}\n:root[data-theme=\"light\"]{\n  color-scheme:light;\n  --color-bg:#f4f5f8;--color-surface:#ffffff;--color-text:#1c1e2b;\n  --color-divider:color-mix(in srgb, #1c1e2b 14%, transparent);\n  --color-neutral-100:#292b31;--color-neutral-200:#3f424d;--color-neutral-300:#595d6c;\n  /* Secondary-text steps. A straight flip of the dark ramp left these at\n     4.0 / 2.7 / 1.9:1 on the light ground (dark mode reads 8.4 / 5.9 / 3.9),\n     so they are re-set to 5.6 / 4.6 / 3.6:1 - same hue, same order. */\n  --color-neutral-400:#5f626e;--color-neutral-500:#6c6f7d;--color-neutral-600:#7d808f;\n  --color-neutral-700:#cfd3e5;--color-neutral-800:#e4e7f5;--color-neutral-900:#f3f5fe;\n  --color-accent:#6a5fc4;--color-accent-100:#2b2741;--color-accent-200:#423a6a;--color-accent-300:#5d5294;\n  --color-accent-400:#796cbf;--color-accent-500:#968ae0;--color-accent-600:#b5abfc;\n  --color-accent-700:#d2cefd;--color-accent-800:#e7e5fe;--color-accent-900:#f5f4ff;\n  --color-accent-2-100:#2b293a;--color-accent-2-200:#423e5d;--color-accent-2-300:#5c5783;\n  --color-accent-2-400:#7972a9;--color-accent-2-500:#9690c9;--color-accent-2-600:#b5afe8;\n  --color-accent-2-700:#d2cefd;--color-accent-2-800:#e7e5fe;--color-accent-2-900:#f5f4ff;\n  --pt-dialog-bg:#ffffff;--pt-input-bg:#eef0f5;--pt-row-div:rgba(28,30,43,.08);--pt-backdrop:rgba(28,30,43,.4);\n  --pt-card-bg:#ffffff;--pt-search-bg:#eef0f5;--pt-error-bg:#fdecee;--pt-error-border:#f3c6cc;--pt-error-text:#8a2f3a;\n  --pt-notice-bg:#fbf1da;--pt-notice-border:#e8cf98;--pt-notice-text:#7a5a12;--pt-notice-text-soft:#8a6a22;--pt-stale:#8a6a1c;\n  /* Status tints read on white: the dark theme's pastel mint and pink sit\n     under 2.5:1 on a light ground, so they deepen here to clear 4.5:1. */\n  --pt-good:#1f8f61;--pt-good-soft:#1b7a53;--pt-bad-soft:#b23a4a;--pt-bad-edge:#c0374a;--pt-edge:#cfd3e5;--pt-muted-fill:#c7cad6;--pt-on-accent:#ffffff;--pt-hover:rgba(28,30,43,.06);--pt-well:rgba(28,30,43,.04);\n}\n/* Figures: the headline numbers are set in Source Serif 4 (SIL Open Font\n   License), packed as a digits-and-currency subset. unicode-range keeps it to\n   those characters, so any letters beside a figure stay in Inter. */\n@font-face{font-family:\"Ledger Figures\";font-style:normal;font-weight:400 700;font-display:swap;src:url(\"5e972562-c6ce-4790-a825-f1958233641c\") format(\"woff2\");unicode-range:U+24-25,U+2B-39,U+A3,U+20AC,U+2212}\n.pt-fig{font-family:\"Ledger Figures\",\"Inter\",system-ui,sans-serif;font-optical-sizing:auto;font-variant-numeric:lining-nums tabular-nums}\n@keyframes ptSpin { to { transform: rotate(360deg); } }\n/* Row delete: a quiet glyph until it is pointed at, and a solid red button\n   only once it is asking for the second, confirming click. */\n.pt-del{display:inline-flex;align-items:center;justify-content:center;vertical-align:middle;min-width:24px;min-height:22px;padding:0 4px;background:none;border:1px solid transparent;border-radius:4px;color:var(--color-neutral-600);cursor:pointer;font-family:inherit;font-size:11px}\n.pt-del:hover,.pt-del:focus-visible{color:var(--pt-bad-edge);border-color:var(--pt-bad-edge)}\n.pt-del-hot{display:inline-flex;align-items:center;justify-content:center;vertical-align:middle;min-height:22px;padding:0 9px;background:#c0374a;border:1px solid #a52a3a;border-radius:5px;color:#fdeaec;cursor:pointer;font-family:inherit;font-size:11px}\n.pt-del-hot:hover{background:#a52a3a}\n/* Class and region read as plain text in the holdings table and only show\n   their control when pointed at or focused. */\n.pt-quiet-sel{-webkit-appearance:none;appearance:none;width:100%;background:transparent;color:var(--color-neutral-400);border:1px solid transparent;border-radius:4px;padding:2px 4px;cursor:pointer;text-overflow:ellipsis;font-family:inherit}\n.pt-quiet-sel:hover,.pt-quiet-sel:focus-visible{background:var(--pt-input-bg);border-color:var(--color-neutral-700);color:var(--color-text)}\n/* Horizontal strips (tabs, account chips) that can overflow on a phone fade\n   out at the right edge so it is obvious there is more to swipe to; the\n   trailing padding lets the last item scroll clear of the fade. */\n.pt-strip{scrollbar-width:none}\n.pt-strip::-webkit-scrollbar{display:none}\n.pt-strip-fade{-webkit-mask-image:linear-gradient(to right,#000 calc(100% - 32px),transparent);mask-image:linear-gradient(to right,#000 calc(100% - 32px),transparent);padding-right:32px !important}\n/* The action row of a long dialog stays pinned to the bottom of the view, so\n   the confirm button never needs a scroll hunt. */\n.pt-sticky-foot{position:sticky;bottom:0;z-index:2;background:var(--pt-dialog-bg);box-shadow:0 -8px 16px -12px rgba(0,0,0,.45)}\n.pt-hdr{transition:transform .22s ease}\n@media (prefers-reduced-motion: reduce){.pt-hdr{transition:none}}\n<\u002Fstyle>\n<template id=\"__bundler_thumbnail\" data-bg-color=\"var(--color-bg)\">\n<svg sc-camel-view-box=\"0 0 240 240\" xmlns=\"http://www.w3.org/2000/svg\">\n  <rect width=\"240\" height=\"240\" fill=\"var(--color-bg)\"><\u002Frect>\n  <rect x=\"72\" y=\"150\" width=\"18\" height=\"42\" fill=\"#5d5294\"><\u002Frect>\n  <rect x=\"98\" ;color:var(--color-neutral-600)\">Plexin Ledger<\u002Fspan>\n          <span style=\"font-size:{{ welcomeH1 }};font-weight:500;line-height:1.15;letter-spacing:-.01em\">Start from your own transactions.<\u002Fspan>\n          <span style=\"font-size:13px;line-height:1.5;color:var(--color-neutral-400);max-width:52ch;text-wrap:pretty\">Import your broker exports. Everything is worked out from your trades and stays in this tab.<\u002Fspan>\n        <\u002Fdiv>\n\n        <div style=\"display:flex;flex-direction:column;gap:8.4px\">\n          <button sc-camel-on-click=\"{{ pickCsv }}\" style=\"display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:56px;font-size:14px;font-weight:600;text-align:left;padding:0 18px;background:var(--color-accent);border:1px solid var(--color-accent);border-radius:8px;color:var(--pt-on-accent);font-family:inherit;cursor:pointer\" style-hover=\"filter:brightness(1.08)\"><span>Import a broker CSV<\u002Fspan><span style=\"font-size:12px;font-weight:500;opacity:.8\">Recommended<\u002Fspan><\u002Fbutton>\n          <button sc-camel-on-click=\"{{ pickJson }}\" style=\"display:flex;align-items:center;min-height:52px;font-size:13px;text-align:left;padding:0 16px;background:transparent;border:1px solid var(--color-neutral-700);border-radius:8px;color:var(--color-neutral-200);font-family:inherit;cursor:pointer\" style-hover=\"background:var(--pt-input-bg)\">Restore a saved JSON backup<\u002Fbutton>\n          <button sc-camel-on-click=\"{{ startDemo }}\" style=\"display:flex;align-items:center;min-height:52px;font-size:13px;text-align:left;padding:0 16px;background:transparent;border:1px solid var(--color-neutral-700);border-radius:8px;color:var(--color-neutral-200);font-family:inherit;cursor:pointer\" style-hover=\"background:var(--pt-input-bg)\">Explore sample data instead<\u002Fbutton>\n        <\u002Fdiv>\n\n        <div style=\"height:1px;background:var(--color-divider)\"><\u002Fdiv>\n\n        <div style=\"display:grid iv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ resolveOpen }}\" hint-placeholder-val=\"{{ false }}\">\n    <div class=\"dialog-backdrop\" sc-camel-on-click=\"{{ bdCloseResolve }}\" style=\"position:fixed;inset:0;background:var(--pt-backdrop);display:flex;align-items:flex-start;justify-content:center;padding:{{ sheetPad }};z-index:22;overflow:auto;-webkit-overflow-scrolling:touch\">\n      <div class=\"dialog\" style=\"width:620px;max-width:100%;background:var(--pt-dialog-bg);border:1px solid var(--color-neutral-700);border-radius:8px;box-shadow:var(--shadow-lg);overflow:hidden\">\n        <div style=\"padding:11.2px 16.8px;border-bottom:1px solid var(--color-divider);display:flex;flex-direction:column;gap:2px\">\n          <span style=\"font-size:13px;font-weight:500\">{{ resolveTitle }}<\u002Fspan>\n          <span style=\"font-size:12px;color:var(--color-neutral-500)\">Without a code, these stay at their last trade price.<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"padding:11.2px 16.8px;font-size:12px;color:var(--color-neutral-400);border-bottom:1px solid var(--color-divider);text-wrap:pretty\">Use the Yahoo Finance code - <span style=\"color:var(--color-neutral-200)\">MSFT<\u002Fspan> for a US listing, <span style=\"color:var(--color-neutral-200)\">SXR8.DE<\u002Fspan> for Xetra, <span style=\"color:var(--color-neutral-200)\">TCS.NS<\u002Fspan> for the NSE, <span style=\"color:var(--color-neutral-200)\">VOD.L<\u002Fspan> for London. Leave blank to price by hand.<\u002Fdiv>\n        <div style=\"max-height:52vh;overflow:auto;-webkit-overflow-scrolling:touch\">\n          <sc-for list=\"{{ resolveRows }}\" as=\"rr\" hint-placeholder-count=\"5\">\n            <div style=\"display:flex;gap:11.2px;align-items:center;padding:9px 16.8px;border-bottom:1px solid var(--pt-row-div);flex-wrap:wrap\">\n              <div style=\"display:flex;flex-direction:column;gap:1px;flex:1 1 200px;min-width:0\">\n                <span style=\"font-size:13px;color:var(--color-neutral-200);overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">{{ rr.name }}<\u002Fspan>\n                <span style=\"font-size:11px;color:var(--color-neutral-600);overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">{{ rr.meta }}<\u002Fspan>\n              <\u002Fdiv>\n              <input value=\"{{ rr.value }}\" sc-camel-on-input=\"{{ rr.set }}\" placeholder=\"Yahoo code\" style=\"flex:0 0 150px;background:var(--pt-input-bg);color:var(--color-neutral-200);border:1px solid var(--color-neutral-800);border-radius:4px;font-size:{{ fieldFont }};padding:0 9px;min-height:{{ tapMin }}\">\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <div style=\"padding:11.2px 16.8px;border-top:1px solid var(--color-divider);display:flex;gap:8.4px;justify-content:flex-end;flex-wrap:wrap\">\n          <button sc-camel-on-click=\"{{ closeResolve }}\" class=\"btn btn-ghost\" style=\"font-size:12px;padding:0 16px;min-height:{{ tapMin }}\">Do this later<\u002Fbutton>\n          <button sc-camel-on-click=\"{{ saveResolve }}\" class=\"btn btn-primary\" style=\"font-size:12px;padding:0 16px;min-height:{{ tapMin }}\">Save and fetch prices<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ showDemo }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"display:flex;gap:11.2px;align-items:center;padding:8.4px 16.8px;background:var(--color-surface);border-bottom:1px solid var(--color-divider);flex-wrap:wrap\">\n      <span style=\"font-size:12px;font-weight:600;color:var(--color-neutral-300)\">Sample data<\u002Fspan>\n      <span style=\"font-size:12px;color:var(--color-neutral-400);flex:1;min-width:220px;text-wrap:pretty\">{{ demoNote }}<\u002Fspan>\n      <button sc-camel-on-click=\"{{ clearSample }}\" class=\"btn btn-secondary\" style=\"font-size:12px;padding:0 14px;min-height:{{ tapMin }}\">Start empty<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if valu u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ scopeEmpty }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"padding:{{ pagePad }}\">\n      <div style=\"border:1px dashed var(--color-neutral-700);border-radius:8px;padding:28px 16.8px;display:flex;flex-direction:column;align-items:center;gap:11.2px;text-align:center\">\n        <span style=\"font-size:15px;font-weight:500;color:var(--color-text)\">{{ scopeEmptyTitle }}<\u002Fspan>\n        <span style=\"font-size:12px;color:var(--color-neutral-500)\">{{ scopeEmptySub }}<\u002Fspan>\n        <div style=\"display:flex;gap:8.4px;flex-wrap:wrap;justify-content:center\">\n          <button sc-camel-on-click=\"{{ scopeEmptyToBooked }}\" class=\"btn btn-secondary\" style=\"font-size:12px;padding:{{ btnPad }};min-height:{{ tapMin }}\">Booked P/L<\u002Fbutton>\n          <button sc-camel-on-click=\"{{ scopeEmptyToTx }}\" class=\"btn btn-secondary\" style=\"font-size:12px;padding:{{ btnPad }};min-height:{{ tapMin }}\">Transactions<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ isSummary }}\" hint-placeholder-val=\"{{ true }}\">\n    <div style=\"padding:{{ pagePad }};display:flex;flex-direction:column;gap:16.8px\">\n      <div style=\"position:{{ sumStick }};top:{{ hdrTop }};z-index:4;display:flex;flex-direction:column;gap:11.2px;background:var(--color-bg);padding-bottom:11.2px\">\n      <div style=\"display:flex;align-items:center;gap:11.2px;flex-wrap:wrap\">\n        <span style=\"font-size:11px;color:var(--color-neutral-600)\">Cash<\u002Fspan>\n        <div style=\"display:flex;gap:2px\">\n          <sc-for list=\"{{ cashOpts }}\" as=\"o\" hint-placeholder-count=\"2\">\n            <button sc-camel-on-click=\"{{ o.pick }}\" style=\"background:{{ o.bg }};color:{{ o.fg }};border:1px solid {{ o.border }};border-radius:6px;font-size:12px;padding:0 14px;min-height:{{ tapMin }};cursor:pointer\">{{ o.label }}<\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:5.6px\">\n        <div sc-camel-on-mouse-enter=\"{{ cashNote.on }}\" sc-camel-on-mouse-leave=\"{{ cashNote.off }}\" sc-camel-on-click=\"{{ cashNote.tap }}\" style=\"display:inline-flex;align-items:center;gap:5.6px;font-size:12px;color:var(--color-neutral-600);cursor:help;width:fit-content\">{{ cashNote.short }}<span style=\"letter-spacing:0;line-height:1;padding:0;box-sizing:border-box;text-indent:0;display:inline-flex;align-items:center;justify-content:center;width:13px;height:13px;flex:none;border-radius:50%;border:1px solid var(--color-neutral-700);font-size:10px;color:var(--color-neutral-500)\">?<\u002Fspan><\u002Fdiv>\n        <sc-if value=\"{{ cashNote.open }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"font-size:12px;line-height:1.45;color:var(--color-accent-200);max-width:640px;text-wrap:pretty\">{{ cashNote.full }}<\u002Fspan><\u002Fsc-if>\n      <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--color-divider);border:1px solid var(--color-divider);border-radius:8px;overflow:{{ kpiClip }}\">\n        <sc-for list=\"{{ kpis }}\" as=\"k\" hint-placeholder-count=\"5\">\n          <div sc-camel-on-mouse-enter=\"{{ k.hoverOn }}\" sc-camel-on-mouse-leave=\"{{ k.hoverOff }}\" sc-camel-on-click=\"{{ k.tap }}\" style=\"grid-column:{{ k.span }};position:relative;border-radius:{{ k.radius }};background:var(--pt-dialog-bg);padding:14px 16.8px;display:flex;flex-direction:column;gap:5.6px;cursor:help\">\n            <span style=\"display:flex;align-items:center;gap:5.6px;font-size:11px;color:var(--color-neutral-600)\">\n              {{ k.label }}\n              <span style=\"letter-spacing:0;line-height:1;padding:0;box-sizing:border-box;text-indent:0;display:inline-flex;align-items:center;justify-content:center;width:13px;height:13px;border-radius:50%;border:1px solid var( \n                <\u002Fsc-for>\n              <\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n          <span style=\"font-size:12px;color:var(--color-accent-300);text-wrap:pretty\">{{ legalNote }}<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ isData }}\" hint-placeholder-val=\"{{ false }}\">\n    <div class=\"dialog-backdrop\" sc-camel-on-click=\"{{ bdCloseData }}\" style=\"position:fixed;inset:0;background:var(--pt-backdrop);display:flex;align-items:flex-start;justify-content:center;padding:{{ sheetPad }};z-index:22;overflow:auto;-webkit-overflow-scrolling:touch\">\n      <div class=\"dialog\" style=\"width:600px;max-width:100%;background:var(--pt-dialog-bg);border:1px solid var(--color-neutral-700);border-radius:8px;box-shadow:var(--shadow-lg)\">\n        <div style=\"padding:11.2px 16.8px;border-bottom:1px solid var(--color-divider);display:flex;align-items:baseline;gap:8.4px;flex-wrap:wrap\">\n          <span style=\"font-size:13px;font-weight:500\">Save / restore state<\u002Fspan>\n          <span style=\"font-size:12px;color:var(--color-neutral-600)\">{{ dataMeta }}<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"padding:14px 16.8px;display:flex;flex-direction:column;gap:14px\">\n          <div style=\"display:flex;flex-direction:column;gap:5.6px\">\n            <span style=\"font-size:11px;color:var(--color-neutral-500)\">Save<\u002Fspan>\n            <div style=\"display:flex;gap:7px;flex-wrap:wrap\">\n              <button sc-camel-on-click=\"{{ exportJson }}\" class=\"btn btn-primary\" style=\"font-size:12px;padding:0 16px;min-height:{{ tapMin }};flex:1;min-width:140px\">Download JSON<\u002Fbutton>\n              <button sc-camel-on-click=\"{{ copyJson }}\" class=\"btn btn-secondary\" style=\"font-size:12px;padding:0 16px;min-height:{{ tapMin }};flex:1;min-width:140px\">Copy to clipboard<\u002Fbutton>\n              <sc-if value=\"{{ canShare }}\" hint-placeholder-val=\"{{ false }}\">\n                <button sc-camel-on-click=\"{{ shareJson }}\" class=\"btn btn-secondary\" style=\"font-size:12px;padding:0 16px;min-height:{{ tapMin }};flex:1;min-width:140px\">Share…<\u002Fbutton>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n            <span style=\"font-size:12px;color:{{ dataNoteColor }};text-wrap:pretty\">{{ dataNote }}<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:5.6px\">\n            <span style=\"font-size:11px;color:var(--color-neutral-500)\">Restore<\u002Fspan>\n            <div style=\"display:flex;gap:7px;flex-wrap:wrap\">\n              <button sc-camel-on-click=\"{{ pickJson }}\" class=\"btn btn-secondary\" style=\"font-size:12px;padding:0 16px;min-height:{{ tapMin }};flex:1;min-width:140px\">Choose a JSON file<\u002Fbutton>\n              <button sc-camel-on-click=\"{{ pickCsv }}\" class=\"btn btn-secondary\" style=\"font-size:12px;padding:0 16px;min-height:{{ tapMin }};flex:1;min-width:140px\">Choose a CSV file<\u002Fbutton>\n            <\u002Fdiv>\n            <span style=\"font-size:12px;color:var(--color-neutral-600);text-wrap:pretty\">Or paste a saved file’s contents.<\u002Fspan>\n            <textarea value=\"{{ pasteText }}\" sc-camel-on-change=\"{{ setPaste }}\" rows=\"{{ pasteRows }}\" placeholder=\"{&quot;holdings&quot;:[…]}\" style=\"background:var(--pt-input-bg);color:var(--color-neutral-200);border:1px solid var(--color-neutral-800);border-radius:4px;font-family:ui-monospace,monospace;font-size:12px;padding:8px;resize:vertical;width:100%;box-sizing:border-box\"><\u002Ftextarea>\n            <div style=\"display:flex;gap:7px;flex-wrap:wrap\">\n              <button sc-camel-on-click=\"{{ importPaste }}\" class=\"btn btn-primary\" style=\"font-size:12px;padding:0 16px;min-height:{{ tapMin }}\">Restore from pasted JSON<\u002Fbutton>\n              <button sc-camel-on-click=\"{{ clearAll }}\" class=\"btn btn-ghost\" style=\"font-size:12px;padding:0 16px;min-height:{{ tapMin }}\">Clear all holdings<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:5.6px\">\n            <span style=\"font-size:11px;color:var(--color-neutral-500)\">Sample files<\u002Fspan>\n            <div style=\"display:flex;gap:7px;flex-wrap:wrap\">\n              <button sc-camel-on-click=\"{{ sampleTx }}\" class=\"btn btn-secondary\" style=\"font-size:12px;padding:0 16px;min-height:{{ tapMin }};flex:1;min-width:140px\">Transactions CSV<\u002Fbutton>\n              <button sc-camel-on-click=\"{{ samplePrices }}\" class=\"btn btn-secondary\" style=\"font-size:12px;padding:0 16px;min-height:{{ tapMin }};flex:1;min-width:140px\">Prices CSV<\u002Fbutton>\n            <\u002Fdiv>\n            <span style=\"font-size:12px;color:var(--color-neutral-600);text-wrap:pretty\">Examples of what each import expects. Your broker’s export usually works as is.<\u002Fspan>\n          <\u002Fdiv>\n          <span style=\"font-size:12px;color:var(--color-neutral-600);text-wrap:pretty\">Nothing is kept after you close the tab. Save first, restore next time.<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"padding:11.2px 16.8px;border-top:1px solid var(--color-divider);display:flex;justify-content:flex-end\">\n          <button sc-camel-on-click=\"{{ closeData }}\" class=\"btn btn-ghost\" style=\"font-size:12px;padding:0 16px;min-height:{{ tapMin }}\">Close<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1480,&quot;height&quot;:1000}}\">\nclass Component extends DCLogic {\n  /* First visit follows the device's light/dark setting; after that the\n     reader's own pick is remembered. Only the theme is kept - no portfolio\n     data touches storage. */\n  static initialTheme() {\n    try {\n      const t = localStorage.getItem('pt.theme');\n      if (t === 'light' || t === 'dark') return t;\n    } catch (e) { /* storage blocked */ }\n    return typeof window !== 'undefined' && window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';\n  }\n  setTheme(theme) {\n    try { localStorage.setItem('pt.theme', theme); } catch (e) { /* storage blocked */ }\n    this.setState({ theme });\n  }\n  applyTheme() {\n    const light = this.state.theme === 'light';\n    document.documentElement.setAttribute('data-theme', light ? 'light' : 'dark');\n    const m = document.querySelector('meta[name=\"theme-color\"]');\n    if (m) m.setAttribute('content', light ? '#ffffff' : '#1b1d2c');\n  }\n  constructor(p) {\n    super(p);\n    this.csvRef = React.createRef();\n    this.jsonRef = React.createRef();\n    this.state = {\n      view: 'summary',\n      acctScope: '',\n      groupBy: 'account',\n      splitBy: 'account',\n      allocBy: 'account',\n      allocBasis: 'value',\n      valHist: null,\n      valLoading: false,\n      valError: null,\n      valRange: 'max',\n      valHover: null,\n      allocPick: {},\n      allocHover: null,\n      sortKey: 'value',\n      sortDir: 'desc',\n      fx: { EUR: 1, USD: 0.921, INR: 0.0110, GBP: 1.164 },\n      fxText: { EUR: '1', USD: '0.921', INR: '0.0110', GBP: '1.164' },\n      showFx: false,\n      showSettings: false,\n      fetching: null,\n      theme: Component.initialTheme(),\n      holdingLimitPct: 15,\n      accountLimitPct: 40,\n      plColorMode: 'red-green',\n      showJson: false,\n      jsonPaste: '',\n      copyMsg: '',\n      w: typeof window !== 'undefined' ? window.innerWidth : 1440,\n      csv: null,\n      fallbackCcy: 'EUR',\n      fallbackAcct: 'Imported',\n      showAccts: false,\n      acctCcyOverride: {},\n      actualCash: {},\n      costMethod: 'fifo',\n      benchSym: 'IWDA.AS',\n      benchHist: null,\n      benchLoading: false,\n      imports: [],\n      acctDraft: {},\n      parseError: null,\n      banner: null,\n      draft: null,\n      narrow: typeof window !== 'undefined' && window.innerWidth < 900,\n      noticesOpen: false,\n      moreOpen: false,\n      jsonDump: null,\n      vw: typeof window !== 'undefined' ? window.innerWidth : 1280,\n      fabHide: false, hintOpen: '', noticeMuted: '',\n      showData: false,\n      pasteText: '',\n      closed: [],\n      txSummary: null,\n      txQuery: '',\n      txDirty: false,\n      q: '',\n      incMonth: '',\n      dataNote: 'Saves plexin-ledger.json to your downloads. If that’s blocked, copy or share it instead.',\n      dataNoteColor: 'var(--color-neutral-600)',\n      /* The sample portfolio is not a list of positions - it is a transaction\n         ledger run through the same importer a user file goes through, seeded in\n         componentDidMount. Hand-written holdings had no lots behind them, so\n         booked P/L, dividends and XIRR were all empty in the demo and any bug in\n         the derived columns stayed invisible until a real file arrived. */\n      holdings: [],\n      /* Nothing is loaded until the reader picks a route, so the first thing on\n         screen is that choice rather than a dashboard of numbers that are not\n         theirs. */\n      firstRun: true,\n      resolveOpen: false,\n      resolveDraft: {},\n      txSize: 50, txPage: 0,\n      holdSize: 50, holdPage: 0\n    };\n  }\n\n  /* One reveal per long explanation: a short line carries the point, the rest\n     waits behind a tap (finger) or a hover (mouse). */\n  hint(key, full, short) {\n    return {\n      short: short || 'What is this?', full,\n      open: this.state.hintOpen === key,\n      on: () => this.setState({ hintOpen: key }),\n      off: () => this.setState(s => (s.hintOpen === key ? { hintOpen: '' } : {})),\n      tap: () => this.setState(s => ({ hintOpen: s.hintOpen === key ? '' : key }))\n    };\n  }\n\n  componentDidMount() {\n    this._onResize = () => {\n      const w = window.innerWidth || 1280;\n      if (Math.abs(w - this.state.vw) > 8) this.setState({ vw: w });\n      this.measureHdr();\n    };\n    if (typeof ResizeObserver !== 'undefined') {\n      this._hdrObs = new ResizeObserver(() => this.measureHdr());\n      if (this.hdrRef.current) this._hdrObs.observe(this.hdrRef.current);\n    }\n    /* The button is pinned over the bottom-left corner, which is where the last\n       summary card (XIRR) lands on a phone. Drop it out of frame while the page\n       is moving and bring it back when it settles, so nothing stays buried. */\n    let lastY = window.scrollY || 0;\n    this._onScroll = () => {\n      const y = window.scrollY || 0;\n      if (y > lastY + 6 && !this.state.fabHide) this.setState({ fabHide: true });\n      else if (y < lastY - 6 && this.state.fabHide) this.setState({ fabHide: false });\n      /* Header: hide once scrolled past it going down, show on any upward\n         scroll or back near the top. Desktop keeps it pinned. */\n      const hh = this.state.hdrH || 0;\n      if (y > lastY + 6 && y > hh && !this.state.hdrHide) this.setState({ hdrHide: true });\n      else if ((y < lastY - 6 || y <= hh) && this.state.hdrHide) this.setState({ hdrHide: false });\n      lastY = y;\n      clearTimeout(this._fabT);\n      this._fabT = setTimeout(() => { if (this.state.fabHide) this.setState({ fabHide: false }); }, 700);\n    };\n    window.addEventListener('scroll', this._onScroll, { passive: true });\n    window.addEventListener('resize', this._onResize);\n    window.addEventListener('orientationchange', this._onResize);\n    this._onResize();\n    this.applyTheme();\n    /* Until the reader picks a theme themselves, follow the device when it\n       switches (e.g. automatic dark mode at sunset). */\n    if (window.matchMedia) {\n      this._mq = window.matchMedia('(prefers-color-scheme: light)');\n      this._onScheme = e => {\n        let saved = null;\n        try { saved = localStorage.getItem('pt.theme'); } catch (err) { /* storage blocked */ }\n        if (!saved) this.setState({ theme: e.matches ? 'light' : 'dark' });\n      };\n      if (this._mq.addEventListener) this._mq.addEventListener('change', this._onScheme);\n    }\n    /* The sample no longer loads itself. Landing inside a stranger's fictional\n       portfolio gave a first-time reader no way to tell demo numbers from their\n       own, so the demo is now a deliberate choice on the welcome screen. */\n  }\n\n  /* Builds the sample portfolio by running an embedded ledger through the real\n     import path - canonTx, then runFifo - so the demo carries lots, realized\n     gains, cost of units sold, dividends and dated flows. Anything derived that\n     breaks is then visible without importing a private file. */\n  /* Loaded as a plain <script src> this is guaranteed present at mount, but the\n     standalone build unpacks helper scripts asynchronously - so wait for the\n     ledger rather than silently starting empty. */\n  seedDemoWhenReady(tries) {\n    if (typeof window !== 'undefined' && window.DEMO_LEDGER_CSV) { this.seedDemo(); return; }\n    if (tries > 60) return;\n    this._seedTimer = setTimeout(() => {\n      if (!this.state.holdings.length) this.seedDemoWhenReady(tries + 1);\n    }, 50);\n  }\n\n  /* The sample ledger carries fixed dates, so left alone it ages: what reads as\n     the last five years today is the last eight in 2029, and the newest trade\n     drifts steadily into the past. The whole ledger is therefore moved by a\n     whole number of MONTHS at seed time, landing the newest transaction three\n     weeks before today - recent enough to read as a live account, far enough\n     back that the last row is not dated tomorrow. Whole months keep the day of\n     the month, so the monthly SIP still falls on the 12th. Returns the shift in\n     months so the sample's price date can follow it. */\n  demoDateShift(rows, dateCol) {\n    if (!dateCol) return 0;\n    let maxT = -Infinity;\n    rows.forEach(r => {\n      const t = this.txTime(r[dateCol], '');\n      if (typeof t === 'number' && t > maxT) maxT = t;\n    });\n    if (!isFinite(maxT)) return 0;\n    const last = new Date(maxT * 1000);\n    const target = new Date(Date.now() - 21 * 86400000);\n    return (target.getUTCFullYear() - last.getUTCFullYear()) * 12 + (target.getUTCMonth() - last.getUTCMonth());\n  }\n\n  /* A day past the end of the target month is clamped to its last day, so a\n     transaction on the 31st does not roll into the month after. */\n  shiftDemoDate(s, n, iso) {\n    const t = this.txTime(s, '');\n    if (typeof t !== 'number' || !n) return s;\n    const d = new Date(t * 1000);\n    const idx = d.getUTCMonth() + n;\n    const y = d.getUTCFullYear() + Math.floor(idx / 12);\n    const m = ((idx % 12) + 12) % 12;\n    const dim = new Date(Date.UTC(y, m + 1, 0)).getUTCDate();\n    const day = Math.min(d.getUTCDate(), dim);\n    const pad = v => String(v).padStart(2, '0');\n    if (iso) return y + '-' + pad(m + 1) + '-' + pad(day);\n    return pad(day) + '-' + ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'][m] + '-' + y;\n  }\n\n  seedDemo() {\n    const text = typeof window !== 'undefined' && window.DEMO_LEDGER_CSV;\n    if (!text) return;\n    try {\n      const p = this.parseCsv(text);\n      const m = this.guessTxMap(p.headers, p.rows);\n      const shift = this.demoDateShift(p.rows, m.date);\n      if (shift && m.date) p.rows.forEach(r => {\n        if (r[m.date]) r[m.date] = this.shiftDemoDate(r[m.date], shift);\n      });\n      if (!m.qty || !m.type) return;\n      const opts = { statuses: [], dec: p.dec, acct: 'Unassigned', fallbackCcy: 'EUR', exclude: 'NA' };\n      const canon = this.canonTx(p.rows, m, opts);\n      const job = { name: 'sample-ledger.csv', rows: canon, map: this.canonMap(/eur/i.test(m.amount || '')), statuses: [], dec: '.', acct: opts.acct, fallbackCcy: 'EUR', exclude: '', actions: {}, demo: true };\n      const r = this.runFifo(canon, job.map, Object.assign({}, job, { method: this.state.costMethod }));\n      if (!r.open.length) return;\n      const stamp = Date.now();\n      const tagged = a => (a || '').trim() || 'Unassigned';\n      const ix = this.autoTagIndex([job]);\n      const autoOf = o => {\n        const s = ix.get(tagged(o.account) + '\\u0000' + o.ticker) || { name: o.name, ccy: o.ccy };\n        return this.autoTag(s.atype, s.name || o.name, s.ccy || o.ccy);\n      };\n      /* Last traded price is whatever the ledger ends on, which for a position\n         last bought in 2021 shows a nonsense open P/L. The sample carries its own\n         mark so the demo reads like a portfolio priced today. */\n      const px = (typeof window !== 'undefined' && window.DEMO_LEDGER_PRICES) || {};\n      const pxDate0 = (typeof window !== 'undefined' && window.DEMO_LEDGER_PRICE_DATE) || '';\n      const pxDate = this.shiftDemoDate(pxDate0, shift, true);\n      const holdings = r.open.map((o, i) => {\n        const mark = px[o.ysym] != null ? px[o.ysym] : px[o.ticker];\n        return {\n          id: 'd' + stamp + '_' + i, ticker: o.ticker, name: o.name, ysym: o.ysym || '',\n          qty: o.qty, buy: o.buy,\n          price: mark != null ? mark : (o.lastPrice > 0 ? o.lastPrice : o.buy),\n          priceDate: mark != null ? pxDate : o.lastDate, stale: mark == null,\n          ccy: o.ccy, account: tagged(o.account),\n          cls: autoOf(o).cls, geo: autoOf(o).geo,\n          realized: o.realized, costSold: o.costSold, demo: true\n        };\n      });\n      const closed = r.closed.map((o, i) => ({\n        id: 'dx' + stamp + '_' + i, ticker: o.ticker, name: o.name, ysym: o.ysym || '', ccy: o.ccy,\n        realized: o.realized, costSold: o.costSold, fees: o.fees, lastDate: o.lastDate,\n        account: tagged(o.account), demo: true\n      }));\n      const sum = {};\n      r.accounts.forEach(a => {\n        const t = r.perAcct.get(a) || { income: 0, fees: 0 };\n        const n = r.open.filter(o => tagged(o.account) === tagged(a)).length + r.closed.filter(o => tagged(o.account) === tagged(a)).length;\n        sum[tagged(a)] = { income: t.income, fees: t.fees, source: job.name, positions: n };\n      });\n      this.setState({\n        holdings, closed, imports: [job],\n        txSummary: { byAccount: sum, rows: r.used, sources: [job.name] }\n      });\n    } catch (e) {\n      /* A broken sample must never block the empty state the user can import into. */\n      if (typeof console !== 'undefined') console.warn('Sample ledger not loaded:', e && e.message);\n    }\n  }\n  componentDidUpdate(pp, ps) {\n    if (ps && (ps.view !== this.state.view || ps.acctScope !== this.state.acctScope || ps.firstRun !== this.state.firstRun)) {\n      ['[data-pt-tab=\"' + this.state.view + '\"]', '[data-pt-scope=\"true\"]'].forEach(sel => {\n        const el = document.querySelector(sel);\n        const strip = el && el.parentElement && el.closest('.pt-strip');\n        if (!strip) return;\n        const r = el.getBoundingClientRect(), b = strip.getBoundingClientRect();\n        if (r.left < b.left || r.right > b.right - 32) strip.scrollBy({ left: r.left - b.left - (b.width - r.width) / 2, behavior: 'smooth' });\n      });\n    }\n    if (!ps || ps.theme !== this.state.theme) this.applyTheme();\n    this.measureHdr();\n    if (this._hdrObs && this.hdrRef.current && this._hdrObserved !== this.hdrRef.current) {\n      this._hdrObserved = this.hdrRef.current;\n      this._hdrObs.observe(this.hdrRef.current);\n    }\n  }\n  componentWillUnmount() {\n    if (this._mq && this._mq.removeEventListener) this._mq.removeEventListener('change', this._onScheme);\n    window.removeEventListener('resize', this._onResize);\n    window.removeEventListener('orientationchange', this._onResize);\n    if (this._ro) this._ro.disconnect();\n  }\n\n  /* One page-size and page-number pair per table, kept in state under\n     \"<key>Size\" and \"<key>Page\". Size 0 means all rows. The page is clamped\n     rather than reset, so narrowing a filter until the current page no longer\n     exists lands on the last real page instead of an empty table. */\n  pager(key, total) {\n    const S = this.state;\n    const size = S[key + 'Size'] === undefined ? 20 : S[key + 'Size'];\n    const per = size === 0 ? Math.max(1, total) : size;\n    const pages = Math.max(1, Math.ceil((total || 0) / per));\n    const page = Math.min(Math.max(0, S[key + 'Page'] || 0), pages - 1);\n    const start = page * per;\n    const end = Math.min(total, start + per);\n    const go = n => () => this.setState({ [key + 'Page']: Math.min(pages - 1, Math.max(0, n)) });\n    return {\n      start, end, page, pages,\n      sizes: [20, 50, 100, 0].map(n => ({\n        label: n === 0 ? 'Max' : String(n),\n        pick: () => this.setState({ [key + 'Size']: n, [key + 'Page']: 0 }),\n        bg: size === n ? 'rgba(145,132,217,.16)' : 'transparent',\n        fg: size === n ? 'var(--color-text)' : 'var(--color-neutral-500)',\n        border: size === n ? 'var(--color-accent)' : 'var(--color-neutral-800)'\n      })),\n      range: total ? (start + 1) + '\\u2013' + end + ' of ' + total : '0 of 0',\n      pageLabel: 'Page ' + (page + 1) + ' of ' + pages,\n      multi: pages > 1,\n      prev: go(page - 1), next: go(page + 1),\n      prevFg: page <= 0 ? 'var(--color-neutral-800)' : 'var(--color-neutral-300)',\n      nextFg: page >= pages - 1 ? 'var(--color-neutral-800)' : 'var(--color-neutral-300)',\n      prevCur: page <= 0 ? 'default' : 'pointer',\n      nextCur: page >= pages - 1 ? 'default' : 'pointer'\n    };\n  }\n\n  /* ---------- helpers ---------- */\n  get pos() {\n    const light = this.state.theme === 'light';\n    if ((this.state.plColorMode || 'red-green') === 'red-green') return light ? '#1f8f61' : 'var(--pt-good)';\n    return light ? '#6a5fc4' : 'var(--color-accent-400)';\n  }\n  get neg() {\n    const light = this.state.theme === 'light';\n    if ((this.state.plColorMode || 'red-green') === 'red-green') nd = this.txKind(g(r, 'type'), isFinite(amtRaw) ? amtRaw : 0, qty);\n        /* Native amount, in priority order: divide a EUR total by the row's\n           own FX rate; else a native amount column; else derive from\n           qty*price; fee is always its own native column. */\n        let native;\n        if (isFinite(amtRaw) && amtRaw) {\n          native = baseAmount && isFinite(rowFxRate) && rowFxRate ? Math.abs(amtRaw) / rowFxRate : Math.abs(amtRaw);\n        } else native = qty * price;\n        if (kind === 'buy') add(acct, ccy, -(native + fee));\n        else if (kind === 'sell') add(acct, ccy, native - fee);\n        else if (kind === 'income') add(acct, ccy, isFinite(amtRaw) && amtRaw ? native : qty * (price || 1));\n        else if (kind === 'fee') add(acct, ccy, -(isFinite(amtRaw) && amtRaw ? native : (fee || qty)));\n        else if (kind === 'cash') add(acct, ccy, /withdraw/.test(type) ? -native : native);\n      });\n    });\n    return bal;\n  }\n\n  /* Every account name the imported ledger mentions, on any row - trades,\n     deposits, closed positions alike. The single source the Accounts panel\n     and the XIRR balance check both read. */\n  ledgerAccounts() {\n    const out = new Set();\n    (this.state.imports || []).forEach(j => {\n      const m = j.map, g = (r, k) => m[k] ? (r[m[k]] || '') : '';\n      (j.rows || []).forEach(r => {\n        const a = ((g(r, 'account') || '').trim() || j.acct || '').trim();\n        if (a) out.add(a);\n      });\n    });\n    (this.state.closed || []).forEach(c => { if (c.account) out.add(c.account); });\n    return [...out];\n  }\n\n  /* One cash row per account+currency the ledger touched, shaped like a\n     holding (qty = balance, price = buy = 1) so it flows through the same\n     value/weight math and shows up in Summary, Allocation and Holdings\n     without special-casing every consumer. */\n  /* The field this feeds is \"the balance you see today\", not an amount to\n     add - so it's read against \n  ccyGeo(ccy) { return { EUR: 'Europe', GBP: 'Europe', USD: 'US', INR: 'India' }[ccy] || 'Global'; }\n\n  bucket(rows, key, total) {\n    const m = new Map();\n    rows.forEach(r => {\n      const k = (r[key] || '').toString().trim() || 'Untagged';\n      m.set(k, (m.get(k) || 0) + r.value);\n    });\n    return [...m.entries()].sort((a, b) => b[1] - a[1]).map(([label, value]) => ({ label, value, pct: total ? value / total * 100 : 0 }));\n  }\n\n  arc(a0, a1, r0, r1) {\n    const p = (r, a) => { const t = (a - 90) * Math.PI / 180; return [(50 + r * Math.cos(t)).toFixed(2), (50 + r * Math.sin(t)).toFixed(2)]; };\n    const laf = a1 - a0 > 180 ? 1 : 0;\n    const A = p(r1, a0), B = p(r1, a1), C = p(r0, a1), D = p(r0, a0);\n    return `M${A[0]} ${A[1]}A${r1} ${r1} 0 ${laf} 1 ${B[0]} ${B[1]}L${C[0]} ${C[1]}A${r0} ${r0} 0 ${laf} 0 ${D[0]} ${D[1]}Z`;\n  }\n  palette() { return ['#968ae0', 'var(--color-accent-400)', '#5d5294', '#7972a9', 'var(--color-neutral-500)', 'var(--color-neutral-700)', 'var(--color-accent-300)', '#423a6a', 'var(--color-neutral-600)', '#2b2741']; }\n\n  /* Charts read as data, so they carry hue - eight slots, stepped per theme\n     and validated as a set against this app's card surfaces (#1a1c2a dark,\n     #ffffff light): every adjacent pair stays apart under protan and deutan\n     simulation, and every dark step clears 3:1. Three light steps sit under\n     3:1 on white, which is why every chart here carries a labelled legend and\n     a table. The ORDER is the colour-blind safety: slot n sits next to slot\n     n+1 in a value-sorted donut, so slots are handed out by rank, never\n     reshuffled. A ninth bucket gets no invented hue - it folds into a neutral\n     \"Other\". */\n  chartPalette() {\n    return this.state.theme === 'light'\n      ? ['#2a78d6', '#eb6834', '#1baf7a', '#eda100', '#e87ba4', '#008300', '#4a3aa7', '#e34948']\n      : ['#3987e5', '#d95926', '#199e70', '#c98500', '#d55181', '#008300', '#9085e9', '#e66767'];\n  }\n  /* Two     const key = (((r.sym || '').trim() || (r.gkey || '').trim() || (r.name || '').trim())).toUpperCase();\n      if (!['buy', 'sell', 'bonus', 'split'].includes(kind) || !key || !qty) return;\n      /* A broker cash line is booked as a priced buy at 1.00, and rows() gives\n         cash-like holdings no cost - so counting it here would put the cash\n         balance into the basis and break the tie to the COST BASIS card. */\n      if (cashKeys.has(key) || /(^|[-_ ])cash([-_ ]|$)/i.test(key) || /_cash$/i.test((r.atype || '').trim())) return;\n      /* The FIFO engine drops a buy or sell it cannot price, so those units are\n         not in the portfolio - counting them here gave the value line holdings\n         that cost nothing, which read as thousands of euros of gain before the\n         cost line had even started. Bonus and split rows are the exception:\n         they legitimately move units at nil cost. */\n      if ((kind === 'buy' || kind === 'sell') && !(price > 0)) return;\n      if (!units.has(key)) {\n        const hit = byKey.get(key) || {};\n        units.set(key, {\n          key, ccy, ev: [],\n          ysym: (hit.sym || (r.sym || '').trim() || symIdx.get(key) || key),\n          heldQty: hit.qty || 0,\n          livePrice: hit.price || 0,\n          liveCcy: hit.ccy || ccy\n        });\n      }\n      const rate = this.rate(ccy) || 0;\n      units.get(key).ev.push({\n        t,\n        /* A split subdivides the units already held (total cost unchanged, per\n           unit cost falls); a bonus ISSUES new units at nil cost. Same shape in\n           the file, different arithmetic - so the walk is told which. */\n        split: kind === 'split',\n        adj: kind === 'split' || kind === 'bonus',\n        /* The trade price is a real observed price for this instrument on this\n           date - the ledger is itself a sparse price history, which is what\n           lets the value line exist with no fetch at all. */\n        px: price > 0 ? price : 0,\n        dq: kind === 'sell' ? -qty : qty,\n        /* Bonus and split units arrive at nil cost, so only a priced buy adds\n           to the basis - the same rule the FIFO engine applies. */\n        cost: kind === 'sell' ? 0 : qty * price * rate + fee * rate\n      });\n    }));\n    units.forEach(u => u.ev.sort((a, b) => a.t - b.t));\n    return { units: [...units.values()] };\n  }\n\n  /* Daily closes for every instrument the ledger touched, so a past value is\n     priced rather than modelled. One request per symbol, same function the\n     benchmark uses; anything that comes back empty is named instead of\n     silently leaving a dip in the curve. */\n  /* The rate limit is on the server's outbound calls, not this browser, so the\n     only real defence is asking less often: a close series for a past date does\n     not change, so it is kept for a day and reused. */\n  histTtlMs() {\n    const hrs = this.state.histTtlH;\n    return (hrs === 0 ? 0 : (hrs || 6)) * 3600e3;\n  }\n\n  histCache(sym, from) {\n    const ttl = this.histTtlMs();\n    if (!ttl) return null;\n    try {\n      const raw = localStorage.getItem('pt.hist.' + sym + '.' + from);\n      if (!raw) return null;\n      const j = JSON.parse(raw);\n      if (!j || Date.now() - j.at >= ttl) return null;\n      this._lastCacheAge = Date.now() - j.at;\n      return j.data;\n    } catch (e) { return null; }\n  }\n\n  ageLabel(ms) {\n    const m = Math.round(ms / 60000);\n    return m < 1 ? 'just now' : m < 60 ? m + ' min old' : Math.round(m / 60) + 'h old';\n  }\n\n  histCacheSet(sym, from, data) {\n    try { localStorage.setItem('pt.hist.' + sym + '.' + from, JSON.stringify({ at: Date.now(), data })); } catch (e) { /* quota or private mode */ }\n  }\n\n  fetchValueHist = async (force) => {\n    const { units } = this.ledgerEvents();\n    if (!units.length) { this.setState({ banner: 'Import your transactions first.' }); return; }\n    const firstT = Math.min(...units.map(u => u.ev[0].t));\n    const from holdings || []).length,\n      Math.round((S.holdings || []).reduce((a, x) => a + (x.price || 0) + (x.qty || 0), 0) * 100)].join('|');\n    if (this._vsKey === memo && this._vs) return this._vs;\n    const { units } = this.ledgerEvents();\n    const dayOf = t => new Date(t * 1000).toISOString().slice(0, 10);\n    let days = [];\n    if (hist) {\n      const set = new Set();\n      Object.keys(hist).forEach(k => Object.keys(hist[k].closes || {}).forEach(d => set.add(d)));\n      days = [...set].sort();\n    } else {\n      const evDays = new Set();\n      units.forEach(u => u.ev.forEach(e => evDays.add(dayOf(e.t))));\n      days = [...evDays].sort();\n      const today = new Date().toISOString().slice(0, 10);\n      if (days.length && days[days.length - 1] !== today) days.push(today);\n    }\n    if (days.length > 420) {\n      const step = Math.ceil(days.length / 420);\n      days = days.filter((d, i) => i % step === 0 || i === days.length - 1);\n    }\n    /* One FIFO queue per instrument, walked once in date order: the lots still\n       unsold on a date ARE that date's cost basis, which is why this line lands\n       on the same figure as the COST BASIS card. */\n    /* An instrument with no price history would add its cost to one line and\n       nothing to the other, which reads as a huge loss that never happened.\n       The value sum therefore covers only instruments with closes, and every\n       cost figure is selected to match whichever set is on screen. */\n    const finalQ = u => u.ev.reduce((a, e) => a + e.dq, 0);\n    /* If the walk does not end on the quantity the app holds, this instrument's\n       past units are wrong - which is what drew value against no cost. Such an\n       instrument is excluded from BOTH lines and counted in the caption. */\n    /* A split used to disqualify an instrument outright. It should not: the\n       broker books it as units arriving at nil cost, which this walk already\n       reproduces, and the quantity check below
